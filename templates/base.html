<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Bourses Afrique{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F1B2D; --navy-2:#16233A; --paper:#F5F1E7; --paper-2:#EBE4D2;
    --gold:#C89B3C; --gold-ink:#7A5A18; --rust:#B54B36; --slate:#8B93A1;
    --ink:#1C2333; --paper-text:#463F30;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--navy);color:var(--paper);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:32px 20px;
  }
  .auth-wrap{width:100%;max-width:430px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:19px;font-weight:600;justify-content:center;margin-bottom:26px;color:var(--paper);text-decoration:none;}
  .brand-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#D9822B);display:flex;align-items:center;justify-content:center;color:var(--navy);}
  .brand-icon svg{width:19px;height:19px;}
  .brand strong{color:var(--gold);}
  .auth-card{background:var(--paper);color:var(--paper-text);border-radius:14px;padding:34px 30px;box-shadow:0 20px 50px rgba(0,0,0,0.35);}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0 0 8px;color:var(--ink);}
  .auth-sub{font-size:13.5px;line-height:1.6;color:#6B6250;margin:0 0 24px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:12.5px;font-weight:600;color:#8A8065;margin-bottom:6px;}
  input{width:100%;padding:11px 13px;border:1px solid var(--paper-2);border-radius:7px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);}
  input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  button[type=submit]{width:100%;margin-top:8px;padding:12px;border:none;border-radius:7px;background:var(--gold);color:var(--navy);font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .15s ease;}
  button[type=submit]:hover{background:#DCB05C;}
  .auth-error{background:rgba(181,75,54,0.1);border:1px solid rgba(181,75,54,0.45);color:var(--rust);font-size:13px;border-radius:7px;padding:10px 12px;margin:0 0 16px;}
  .auth-switch{font-size:13px;color:#6B6250;text-align:center;margin:20px 0 0;}
  .auth-switch a{color:var(--gold-ink);font-weight:600;}
  .auth-note{font-size:11.5px;color:var(--slate);text-align:center;margin:18px 0 0;line-height:1.5;}
</style>
</head>
<body>
  <main class="auth-wrap">
    <a class="brand" href="/">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/></svg>
      </span>
      <span>Bourses<strong>Afrique</strong></span>
    </a>
    <div class="auth-card">
      <h1>{% block heading %}{% endblock %}</h1>
      <p class="auth-sub">{% block subtitle %}{% endblock %}</p>
      {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
      <form method="post" autocomplete="on">
        {% block fields %}{% endblock %}
        <button type="submit">{% block button %}{% endblock %}</button>
      </form>
      <p class="auth-switch">{% block switch %}{% endblock %}</p>
    </div>
    <p class="auth-note">Bourses d'études vérifiées pour étudiants africains.</p>
  </main>
</body>
</html>
